name: Daily AI Engineer Scout Report

on:
  schedule:
    # Runs Mon/Wed/Fri at 8:00 AM BRT (11:00 AM UTC)
    - cron: '0 11 * * 1,3,5'
  workflow_dispatch:  # Allow manual trigger
    inputs:
      target_role:
        description: 'Target job title to search for'
        required: false
        default: 'Applied AI Engineer'
        type: string

permissions:
  contents: write

env:
  UV_FROZEN: "true"

jobs:
  generate-and-send-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Install dependencies
        run: |
          uv sync --frozen

      - name: Create reports directory
        run: mkdir -p reports

      - name: Run research agent
        env:
          TARGET_ROLE: ${{ inputs.target_role || vars.TARGET_ROLE || secrets.TARGET_ROLE || 'Applied AI Engineer' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ZHIPUAI_API_KEY: ${{ secrets.ZHIPUAI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          LANGCHAIN_API_KEY: ${{ secrets.LANGCHAIN_API_KEY }}
          LANGCHAIN_TRACING_V2: ${{ secrets.LANGCHAIN_TRACING_V2 }}
          LANGCHAIN_PROJECT: ${{ secrets.LANGCHAIN_PROJECT }}
        run: |
          uv run python research_agent.py

      - name: Generate timestamped report filename
        id: timestamp
        run: |
          echo "filename=report_$(date +%Y%m%d_%H%M%S).md" >> $GITHUB_OUTPUT
          echo "date=$(date +%Y-%m-%d)" >> $GITHUB_OUTPUT

      - name: Copy report to reports directory
        run: |
          cp final_report.md reports/${{ steps.timestamp.outputs.filename }}

      - name: Commit report to repository
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add reports/${{ steps.timestamp.outputs.filename }} seen_jobs.json
          git diff --staged --quiet || git commit -m "Add daily report ${{ steps.timestamp.outputs.date }} and update seen jobs"
          git push

      - name: Send report via Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          uv run python send_report_telegram.py
